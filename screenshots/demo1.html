<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>demo1 - 选中复制</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#1b1b2f; font-family:'Segoe UI','Microsoft YaHei',sans-serif; padding:32px 40px; color:#e8e8f0; }
  .app { max-width:900px; margin:0 auto; }
  .bar { display:flex; align-items:center; gap:10px; margin-bottom:24px; }
  .logo { width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,#1a73e8,#00c6ff); display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; font-size:18px; }
  .brand { font-weight:600; font-size:16px; }
  .tag { margin-left:auto; font-size:12px; color:#9aa0b5; background:#26263c; border:1px solid #34344f; padding:4px 12px; border-radius:20px; }
  .bubble { background:#26263c; border-radius:14px; padding:26px 30px; line-height:1.75; font-size:14.5px; position:relative; border:1px solid #34344f; }
  .bubble h3 { font-size:17px; margin:6px 0 10px; color:#7fd4ff; }
  .bubble ul { margin:8px 0 8px 22px; }
  .bubble li { margin:4px 0; }
  .bubble table { border-collapse:collapse; margin:12px 0; width:100%; font-size:13.5px; }
  .bubble th,.bubble td { border:1px solid #4a4a6a; padding:6px 12px; text-align:left; }
  .bubble th { background:#32324e; }
  .bubble code { background:#3a3a58; padding:1px 6px; border-radius:4px; font-family:Consolas,monospace; font-size:13px; }
  .bubble pre { background:#1f1f33; border:1px solid #34344f; border-radius:8px; padding:12px 14px; margin:10px 0; font-family:Consolas,monospace; font-size:13px; overflow-x:auto; }
  .sel { background:rgba(26,115,232,.35); border-bottom:2px solid #4d9fff; border-radius:3px; }
  .floating { position:absolute; top:-46px; right:18px; background:#1a73e8; color:#fff; font-size:13.5px; font-weight:600; padding:9px 16px; border-radius:8px; box-shadow:0 4px 14px rgba(0,0,0,.45); display:flex; align-items:center; gap:7px; }
  .floating::after { content:''; position:absolute; bottom:-5px; right:24px; width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-top:6px solid #1a73e8; }
  .footer { margin-top:26px; font-size:12px; color:#7c82a0; text-align:center; }
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="logo">A</div>
    <div class="brand">AI 对话助手</div>
    <div class="tag">DeepSeek 风格演示</div>
  </div>
  <div class="bubble">
    <div class="floating">📋 复制为 Word 格式</div>
    <h3>DeepSeek:如何提高工作效率?</h3>
    <p>提高工作效率可以从以下三个维度入手:</p>
    <ul>
      <li><span class="sel">**时间管理**:使用番茄工作法,25 分钟专注 + 5 分钟休息</span></li>
      <li>任务优先级:用「重要/紧急」四象限给任务排序</li>
      <li><span class="sel">工具自动化:重复性工作交给脚本或 AI 完成</span></li>
    </ul>
    <table>
      <tr><th>方法</th><th>适用场景</th><th>难度</th></tr>
      <tr><td>番茄工作法</td><td>需要长时间专注</td><td>低</td></tr>
      <tr><td>四象限法则</td><td>任务多、优先级混乱</td><td>低</td></tr>
      <tr><td>自动化工具</td><td>重复性工作</td><td>中</td></tr>
    </table>
    <p>关键原则:<span class="sel">一次只做一件事</span>,并定期复盘。</p>
  </div>
  <div class="footer">演示页面:选中 AI 回复内容后,点击浮出的「复制为 Word 格式」按钮</div>
</div>
</body>
</html>
